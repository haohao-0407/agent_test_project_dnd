models:
  # Keep values empty while the graph uses the offline DeterministicDM.
  # Fill these when wiring real LLM calls.
  default:
    model: "deepseek-v4-flash"
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL

  # Example Anthropic:
  # dm:
  #   model: "anthropic:claude-sonnet-4-5"
  #   api_key_env: ANTHROPIC_API_KEY
  #   base_url_env: ANTHROPIC_BASE_URL
  #   temperature: 0.7
  dm:
    model: "deepseek-v4-flash"
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    temperature: 0.7

  # Example OpenAI or OpenAI-compatible third-party gateway:
  # player:
  #   model: "openai:gpt-4o-mini"
  #   api_key_env: OPENAI_API_KEY
  #   base_url_env: OPENAI_BASE_URL
  #   temperature: 0.8
  player:
    model: "deepseek-v4-flash"
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    temperature: 0.8

  summarizer:
    model: "deepseek-v4-flash"
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    temperature: 0.2

  moderator:
    model: "deepseek-v4-flash"
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    temperature: 0.0
